openapi: 3.0.0
info:
  title: Patterns 2026 REST API
  version: "1.0"
  description: REST API для управления доменными моделями, отчетами и хранилищем

servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  /api/reports/formats:
    get:
      summary: Получить список всех форматов для построения отчетов
      description: Возвращает массив всех поддерживаемых форматов отчетов в формате JSON.
      operationId: main.get_reports_formats
      responses:
        '200':
          description: Список доступных форматов отчетов
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                example: ["CSV", "MARKDOWN", "JSON", "HTML", "XML", "TXT"]

  /api/get_formats:
    get:
      summary: Получить список форматов (текстовый вид)
      operationId: main.get_formats
      responses:
        '200':
          description: Строка форматов через запятую
          content:
            text/plain:
              schema:
                type: string

  /api/get_entities:
    get:
      summary: Получить список доменных категорий
      operationId: main.get_entities
      responses:
        '200':
          description: Список категорий хранилища
          content:
            text/plain:
              schema:
                type: string

  /api/get_default_report:
    get:
      summary: Получить отчет по сущности в формате по умолчанию
      operationId: main.get_default_report
      parameters:
        - name: entity
          in: query
          required: true
          schema:
            type: string
        - name: unique_code
          in: query
          required: false
          schema:
            type: string
        - name: id
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Успешно сгенерированный отчет
        '400':
          description: Ошибка параметров запроса
        '404':
          description: Сущность не найдена

  /api/report/{entity_type}/{entity_id}:
    get:
      summary: Сформировать отчет по формату, типу сущности и идентификатору
      operationId: main.get_entity_report
      parameters:
        - name: entity_type
          in: path
          required: true
          schema:
            type: string
        - name: entity_id
          in: path
          required: true
          schema:
            type: string
        - name: format
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Сформированный отчет
        '400':
          description: Некорректный формат отчета
        '404':
          description: Сущность не найдена

  /api/entities/{entity}:
    get:
      summary: Получить список всех сущностей указанной категории
      operationId: main.get_entities_list
      parameters:
        - name: entity
          in: path
          required: true
          schema:
            type: string
          description: Наименование категории (range_model, storage_key, group_model, nomenclature_model, receipt_model)
      responses:
        '200':
          description: Список объектов категории в формате JSON
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '404':
          description: Категория не найдена
    post:
      summary: Добавить новую сущность в категорию
      operationId: main.post_entity
      parameters:
        - name: entity
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Сущность успешно добавлена
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Ошибка валидации данных или параметров

  /api/entities/{entity}/{id}:
    get:
      summary: Получить сущность по идентификатору
      operationId: main.get_entity_by_id
      parameters:
        - name: entity
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Данные сущности в формате JSON
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Сущность не найдена
    put:
      summary: Обновить поля сущности
      operationId: main.put_entity
      parameters:
        - name: entity
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Сущность успешно обновлена
        '400':
          description: Ошибка валидации данных
        '404':
          description: Сущность не найдена
        '409':
          description: Запрещено изменять код (id) сущности из-за связанных данных
    delete:
      summary: Удалить сущность с проверкой ссылочной целостности
      operationId: main.delete_entity
      parameters:
        - name: entity
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Сущность успешно удалена
        '404':
          description: Сущность не найдена
        '409':
          description: Запрещено удалять сущность, так как с ней связаны другие сущности

  /api/filter/{domain}:
    post:
      summary: Фильтрация сущностей указанной категории через Прототип
      operationId: main.post_filter_domain
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            type: string
          description: Категория доменных сущностей (range, group, storage, nomenclature, receipt)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      field_name:
                        type: string
                      filter_type:
                        type: string
                        example: "LIKE"
                      value:
                        type: string
                        example: "мука"
      responses:
        '200':
          description: Отфильтрованный список доменных сущностей
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '400':
          description: Некорректный формат фильтра
        '404':
          description: Категория не найдена

  /api/osv/filter:
    post:
      summary: Формирование Оборотно-сальдовой ведомости с фильтрацией через Прототип
      operationId: main.post_osv_filter
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      field_name:
                        type: string
                      filter_type:
                        type: string
                      value:
                        type: string
      responses:
        '200':
          description: Сформированные строки Оборотно-сальдовой ведомости
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    storage_name:
                      type: string
                    storage_id:
                      type: string
                    nomenclature_name:
                      type: string
                    nomenclature_id:
                      type: string
                    range_name:
                      type: string
                    start_balance:
                      type: number
                    income:
                      type: number
                    outcome:
                      type: number
                    end_balance:
                      type: number
        '400':
          description: Ошибка параметров фильтрации
  /api/logs:
    get:
      summary: Получить записи журнала событий в формате JSON
      operationId: main.get_logs
      parameters:
        - name: level
          in: query
          required: false
          schema:
            type: string
            enum: [ERROR, INFO, DEBUG]
        - name: subsystem
          in: query
          required: false
          schema:
            type: string
        - name: sort_by
          in: query
          required: false
          schema:
            type: string
            default: period
            enum: [period, subsystem, level, event_type, message]
        - name: sort_direction
          in: query
          required: false
          schema:
            type: string
            default: DESC
            enum: [ASC, DESC]
      responses:
        '200':
          description: Список записей журнала событий
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LogEntry'
        '400':
          description: Некорректные параметры запроса журнала

  /api/logs/filter:
    post:
      summary: Фильтрация и сортировка записей журнала событий через Прототип
      operationId: main.post_logs_filter
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogQuery'
      responses:
        '200':
          description: Отфильтрованный и отсортированный список записей журнала
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LogEntry'
        '400':
          description: Ошибка параметров фильтрации или сортировки

  /api/logs/export:
    get:
      summary: Экспорт записей журнала событий в указанном формате
      operationId: main.get_logs_export
      parameters:
        - name: format
          in: query
          required: false
          schema:
            type: string
            default: TXT
            enum: [JSON, TXT, CSV, MARKDOWN]
        - name: level
          in: query
          required: false
          schema:
            type: string
            enum: [ERROR, INFO, DEBUG]
        - name: subsystem
          in: query
          required: false
          schema:
            type: string
        - name: sort_by
          in: query
          required: false
          schema:
            type: string
            default: period
        - name: sort_direction
          in: query
          required: false
          schema:
            type: string
            default: DESC
      responses:
        '200':
          description: Выгруженный журнал событий в выбранном формате
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LogEntry'
            text/plain:
              schema:
                type: string
            text/csv:
              schema:
                type: string
            text/markdown:
              schema:
                type: string
        '400':
          description: Неподдерживаемый формат или некорректные параметры запроса
    post:
      summary: Экспорт отфильтрованного журнала событий в указанном формате
      operationId: main.post_logs_export
      parameters:
        - name: format
          in: query
          required: false
          schema:
            type: string
            default: TXT
            enum: [JSON, TXT, CSV, MARKDOWN]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogQuery'
      responses:
        '200':
          description: Выгруженный журнал событий в выбранном формате
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LogEntry'
            text/plain:
              schema:
                type: string
            text/csv:
              schema:
                type: string
            text/markdown:
              schema:
                type: string
        '400':
          description: Неподдерживаемый формат или некорректные параметры запроса

components:
  schemas:
    LogEntry:
      type: object
      properties:
        id:
          type: string
        period:
          type: string
          format: date-time
        subsystem:
          type: string
        level:
          type: string
          enum: [ERROR, INFO, DEBUG]
        event_type:
          type: string
        message:
          type: string
        type:
          type: string
    FilterItem:
      type: object
      properties:
        field_name:
          type: string
          example: level
        filter_type:
          type: string
          example: EQUALS
        value:
          type: string
          example: ERROR
    LogQuery:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FilterItem'
        sort_by:
          type: string
          default: period
          enum: [period, subsystem, level, event_type, message]
        sort_direction:
          type: string
          default: DESC
          enum: [ASC, DESC]
